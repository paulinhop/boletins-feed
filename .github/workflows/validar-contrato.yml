name: Validar contrato editorial
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'prompts/**', 'boletim-*.html', 'evidencias/**']
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/editorial-contract.test.mjs scripts/gateway-policy.test.mjs
      - run: node scripts/build-feed.mjs .
