# Gera o rascunho semanal dos boletins via API de IA e abre PR para revisão
# médica (roadmap 2.8). A publicação real só acontece no merge — ver
# publicar-feed.yml.
name: Gerar rascunho semanal

on:
  schedule:
    # Segundas 07:12 em America/Sao_Paulo (10:12 UTC) — provedor padrão: Claude
    - cron: '12 10 * * 1'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provedor de IA (todos = comparativo A/B/C, um PR por provedor)'
        required: true
        default: 'claude'
        type: choice
        options: [claude, openai, kimi, todos]

permissions:
  contents: write
  pull-requests: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gera boletins e abre PR(s) de rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ESCOLHA: ${{ inputs.provider || 'claude' }}
        run: bash scripts/gerar-rascunho-e-pr.sh
