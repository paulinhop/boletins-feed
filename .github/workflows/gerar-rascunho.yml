# IA exclusivamente pelo gateway local (13/09/2026).
# O gateway privado nao e exposto ao Actions; geracao automatica pausada.
name: Gerar rascunho semanal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orientacao:
    runs-on: ubuntu-latest
    steps:
      - name: Geracao pausada no Actions
        run: |
          echo 'Gere localmente pelo gateway autorizado e encaminhe o rascunho para revisao.'
          echo 'APIs diretas de IA estao bloqueadas. Nenhum boletim foi gerado por este workflow.'
